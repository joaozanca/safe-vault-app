[pytest]
testpaths = tests
# Permite `from pages... import` e `from support... import` a partir da raiz da suíte.
pythonpath = .
# -ra: resumo no fim com o motivo de cada teste que falhou/foi pulado.
# --alluredir: cada execução grava os resultados brutos que o Allure transforma em HTML.
addopts = -ra --alluredir=allure-results
markers =
    smoke: fluxos críticos — rodam primeiro e em toda execução da pipeline
